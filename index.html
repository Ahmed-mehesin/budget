<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ميزانية البيت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>ميزانية البيت</h1>
  <div class="tools">
    <button id="addMonth">+ شهر</button>
    <button id="addRow">+ بند</button>
    <button id="csv">تصدير Excel</button>
    <button id="save">حفظ نسخة</button>
    <label class="btn">استيراد نسخة<input type="file" id="load" accept=".json" hidden></label>
    <button id="print">طباعة</button>
    <button id="theme">الوضع الداكن</button>
  </div>
</header>
<main>
  <section class="sum">
    <label>الشهر: <select id="mSel"></select></label>
    <div id="cards"></div>
  </section>
  <section class="wrap"><table id="tbl"></table></section>
  <p class="hint">اكتب المبلغ مباشرة، أو اضغط زر التفاصيل بجانبه لإدخال كل مشتريات البند بسعرها، والمجموع يتحسب تلقائيًا. البيانات محفوظة في متصفحك.</p>
  <section>
    <h2>توزيع المصروفات في الشهر المختار</h2>
    <div id="chart"></div>
  </section>
</main>
<dialog id="dlg"></dialog>
<script src="app.js"></script>
</body>
</html>
